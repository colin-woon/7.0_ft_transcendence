version: "2"
servers: []
sql:
  - engine: "postgresql"
    queries:
      - "sql/friendship_queries.sql"
      - "sql/message_queries.sql"
    schema: "sql/schema.sql"
    gen:
      go:
        package: "database"
        sql_package: "pgx/v5"
        out: "internal/database"
        output_db_file_name: "db_engine.go"
        emit_json_tags: true
        json_tags_case_style: "camel"
plugins: []
rules: []
options:
