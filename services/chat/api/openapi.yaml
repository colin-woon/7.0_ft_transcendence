openapi: 3.0.4
info:
  title: Chat Service API
  version: 1.0.0
  description: API for managing messages and friendships
tags:
  - name: Friendship
    description: Endpoints for managing friendships
  - name: Message
    description: Endpoints for managing chat messages

security:
  - GatewayUserHeader: []

components:
  securitySchemes:
    GatewayUserHeader:
      type: apiKey
      in: header
      name: X-Intra-User-Id
      description: "Dev Mode: Manually inject the user ID that the Gateway normally provides."
  schemas:
    ChatRoom:
      type: object
      required: [chatId, type]
      properties:
        chatId:
          type: string
          format: uuid
        type:
          type: string
          enum: [direct, group]
        name:
          type: string
          nullable: true
          description: "Will be null for direct chats"
        memberIds:
          type: array
          items:
            type: integer
          description: "List of all user IDs in this chat. Frontend uses this to fetch avatars/names."
    ChatMessage:
      type: object
      required: [id, chatId, senderId, content, createdAt]
      properties:
        id:
          type: integer
        chatId:
          type: string
          format: uuid
        senderId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
          example: "2026-03-09T08:24:27Z"
    TypingIndicator:
      type: object
      required: [chatId, senderId]
      properties:
        chatId:
          type: string
          format: uuid
        senderId:
          type: integer
    ReadReceipt:
      type: object
      required: [chatId, userId, messageId]
      properties:
        chatId:
          type: string
          format: uuid
        userId:
          type: integer
        messageId:
          type: integer
    UserStatus:
      type: object
      required: [userId, isOnline]
      properties:
        userId:
          type: integer
          description: The user whose status changed
        isOnline:
          type: boolean
          description: Whether the user is now online or offline
    FriendshipStatus:
      type: string
      enum: [requested, accepted, blocked, pending]
    PendingFriendRequest:
      type: object
      required: [requesterId, addresseeId, status]
      properties:
        requesterId: { type: integer }
        addresseeId: { type: integer }
        status:
          $ref: '#/components/schemas/FriendshipStatus'
    PendingFriendRequestList:
      type: array
      items:
        $ref: "#/components/schemas/PendingFriendRequest"
    FriendList:
      type: array
      items:
        type: object
        properties:
          friendId:
            type: integer
            description: Unique identifier for the friend
          chatId:
            type: string
            format: uuid
            description: Unique identifier for the chat between the user and the friend
          isOnline:
            type: boolean
            description: Whether the friend is currently online
      example:
        friendId: 123
        chatId: "550e8400-e29b-41d4-a716"
        isOnline: true
    StreamEvent:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [NEW_MESSAGE, USER_TYPING, USER_STATUS, USER_READ]
          description: "The type of event being sent down the stream"
        payload:
          type: object
          description: "The actual data, structure depends on the event type"
          # We use oneOf to say "If it's a message, expect ChatMessage data"
          oneOf:
            - $ref: "#/components/schemas/ChatMessage"
            - $ref: "#/components/schemas/TypingIndicator"
            - $ref: "#/components/schemas/ReadReceipt"
            - $ref: "#/components/schemas/UserStatus"

paths:
  /friendship/{receiverId}:
    post:
      tags:
        - Friendship
      summary: Send a friend request
      operationId: sendFriendRequest
      parameters:
        - name: receiverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Friend request sent successfully
        "400":
          description: Invalid user IDs
        "404":
          description: User not found

  /friendship/{targetUserId}:
    patch:
      tags:
        - Friendship
      summary: Update friendship status
      operationId: updateFriendshipStatus
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FriendshipStatus'
      responses:
        "200":
          description: Status updated successfully
        "400":
          description: Invalid status value
        "404":
          description: Request not found
        "500":
          description: Internal Server Error

  /message/request/{requesterId}/accept:
    patch:
      tags:
        - Friendship
      summary: Accept initial message request
      operationId: acceptMessageRequest
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted
        "404":
          description: Request not found
        "500":
          description: Internal error

  /message/request/{receiverId}:
    post:
      tags:
        - Message
      summary: Send initial message request (creates room, friendship, sends 1 msg)
      operationId: sendMessageRequest
      parameters:
        - name: receiverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Message sent, room created
        "403":
          description: Not allowed
        "500":
          description: Internal error

  /friendship:
    get:
      tags:
        - Friendship
      summary: Get friend list for a user with chat ID references
      operationId: getFriendList
      responses:
        "200":
          description: Friend list and associated chat IDs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendList"
        "400":
          description: Invalid user ID
        "404":
          description: User not found
        "500":
          description: Internal Server Error

  /friendship/pending:
    get:
      tags:
        - Friendship
      summary: Get incoming pending friend requests for a user
      operationId: getPendingFriendRequests
      responses:
        "200":
          description: Pending friend requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingFriendRequestList"
        "400":
          description: Invalid user ID
        "500":
          description: Internal Server Error

  /message/{chatId}:
    post:
      tags:
        - Message
      summary: Send a chat message
      operationId: sendMessage
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Message sent successfully
        "400":
          description: Invalid user IDs or message content

  /message/history/{chatId}:
    get:
      tags:
        - Message
      summary: Get chat history for a specific chat
      operationId: getMessageHistory
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid chat ID
        "404":
          description: No chat history found

  /message/stream:
    get:
      tags:
        - Message
      summary: Opens an SSE connection for real-time functionalities
      operationId: getMessageStream
      responses:
        "200":
          description: SSE connection successful
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "401":
          description: Unauthorized

  /message/inbox:
    get:
      tags:
        - Message
      summary: Get all chats (direct and group) for a user's inbox
      operationId: getUserInbox
      responses:
        "200":
          description: Successfully retrieved user's chat rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRoom"

  /message/group/create:
    post:
      tags:
        - Message
      summary: Create a new group chat
      operationId: createGroupChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, memberIds]
              properties:
                name:
                  type: string
                  description: "Name of the group chat"
                memberIds:
                  type: array
                  items:
                    type: integer
                  description: "List of user IDs to add to the group"
      responses:
        "201":
          description: Group chat created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRoom"

  /message/typing/{chatId}:
    post:
      tags:
        - Message
      summary: Send a typing indicator event
      operationId: sendTypingEvent
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Typing broadcast triggered successfully
        "400":
          description: Invalid user IDs or form data

  /message/read/{chatId}:
    patch:
      tags:
        - Message
      summary: Update the last read message for a user in a chat
      operationId: updateReadReceipt
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId:
                  type: integer
      responses:
        "204":
          description: Read receipt updated successfully
        "400":
          description: Invalid input
