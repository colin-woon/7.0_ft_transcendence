openapi: 3.0.4
info:
  title: Chat Service API
  version: 1.0.0
  description: API for managing messages and friendships
tags:
  - name: Friendship
    description: Endpoints for managing friendships
  - name: Message
    description: Endpoints for managing chat messages

components:
  schemas:
    ChatMessage:
      type: object
      required: [id, senderId, receiverId, content, createdAt]
      properties:
        id:
          type: integer
        senderId:
          type: integer
        receiverId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
          example: "2026-03-09T08:24:27Z"

paths:
  /friendship/{requesterId}/{receiverId}:
    post:
      tags:
        - Friendship
      summary: Send a friend request
      operationId: sendFriendRequest
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
        - name: receiverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Friend request sent successfully
        "400":
          description: Invalid user IDs
        "404":
          description: User not found

  /friendship/{requesterId}/{receiverId}/accept:
    patch:
      tags:
        - Friendship
      summary: Accept a friend request
      operationId: acceptFriendRequest
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
        - name: receiverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Friend request accepted successfully
        "404":
          description: Request not found

  /message/{senderId}/{receiverId}:
    post:
      tags:
        - Message
      summary: Send a chat message
      operationId: sendMessage
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: integer
        - name: receiverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Message sent successfully
        "400":
          description: Invalid user IDs or message content

  /message/history/{senderId}/{receiverId}:
    get:
      tags:
        - Message
      summary: Get chat history between two users
      operationId: getMessageHistory
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: integer
        - name: receiverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chat history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid user IDs
        "404":
          description: No chat history found

  /message/stream/{tempUserId}:
    get:
      tags:
        - Message
      summary: Opens an SSE connection for real-time chat message updates
      operationId: getMessageStream
      parameters:
        - name: tempUserId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SSE connection successful
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Unauthorized
