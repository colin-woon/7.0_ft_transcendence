# --- Application Settings ---
app.domain.name=${DOMAIN_NAME:localhost}
# Production: nginx terminates TLS on 443, no port needed
app.public.url=https://${DOMAIN_NAME:localhost}
# Dev: direct access with port
%dev.app.public.url=http://${DOMAIN_NAME:localhost}:${AUTH_PORT:8002}

# --- Management Endpoint (Health Check) ---
quarkus.management.enabled=true
quarkus.management.port=9000

# mTLS Configuration for Auth Service
quarkus.http.ssl.client-auth=none
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=disabled
%dev.quarkus.http.insecure-requests=enabled

%dev.quarkus.http.ssl.client-auth=none
%dev.quarkus.http.ssl.certificate.key-store-file=
%dev.quarkus.http.ssl.certificate.trust-store-file=

quarkus.http.ssl.certificate.key-store-file=/certs/auth-keystore.p12
quarkus.http.ssl.certificate.key-store-password=bumintra
quarkus.http.ssl.certificate.key-store-file-type=PKCS12

# quarkus.http.ssl.certificate.trust-store-file=/certs/shared-truststore.p12
# quarkus.http.ssl.certificate.trust-store-password=bumintra
# quarkus.http.ssl.certificate.trust-store-file-type=PKCS12

# --- Database Connection ---
quarkus.datasource.db-kind=postgresql
#username and pass below defaults to dev_user and dev_password if env not found. to remove later
quarkus.datasource.username=${DB_USER:dev_user}
quarkus.datasource.password=${DB_PASSWORD:dev_password}
# Connect to the 'db' service defined in docker-compose // comment to use ENV vars
quarkus.datasource.jdbc.url=jdbc:postgresql://db-service:5432/postgres_db

# --- Schema Isolation ---
# ensures Auth Service ONLY sees the 'auth_service' schema
quarkus.datasource.jdbc.schema=auth_service

# --- Hibernate (ORM) ---
# 'update': Auto-creates tables based on your @Entity classes
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# --- HTTP Server ---
# Run on port 8080 (internally), we map it to 8002 in Docker
quarkus.http.port=8080
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.proxy-address-forwarding=true

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://${DOMAIN_NAME:localhost},http://localhost:8002,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Set-Cookie
quarkus.http.cors.access-control-allow-credentials=true

# =============================================================
# DEFAULT OIDC TENANT — DISABLED
# =============================================================
quarkus.oidc.tenant-enabled=false

# =============================================================
# GOOGLE OIDC TENANT
# =============================================================
quarkus.oidc.google.provider=google
quarkus.oidc.google.tenant-id=google
quarkus.oidc.google.auth-server-url=https://accounts.google.com
quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
quarkus.oidc.google.credentials.secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
quarkus.oidc.google.authentication.user-info-required=true
quarkus.oidc.google.authentication.scopes=openid,profile,email
quarkus.oidc.google.authentication.redirect-path=/api/public/auth/callback/google
quarkus.oidc.google.authentication.restore-path-after-redirect=true
quarkus.oidc.google.application-type=web-app

# =============================================================
# 42 OIDC TENANT
# =============================================================
quarkus.oidc.42.tenant-id=42
quarkus.oidc.42.auth-server-url=https://api.intra.42.fr
quarkus.oidc.42.client-id=${FT_CLIENT_ID}
quarkus.oidc.42.credentials.secret=${FT_CLIENT_SECRET}
quarkus.oidc.42.discovery-enabled=false
quarkus.oidc.42.authorization-path=https://api.intra.42.fr/oauth/authorize
quarkus.oidc.42.token-path=https://api.intra.42.fr/oauth/token
quarkus.oidc.42.token.principal-claim=login
quarkus.oidc.42.user-info-path=https://api.intra.42.fr/v2/me
quarkus.oidc.42.authentication.user-info-required=true
quarkus.oidc.42.authentication.scopes=public
quarkus.oidc.42.authentication.add-openid-scope=false
quarkus.oidc.42.authentication.redirect-path=/api/public/auth/callback/42
quarkus.oidc.42.authentication.restore-path-after-redirect=true
quarkus.oidc.42.authentication.id-token-required=false
quarkus.oidc.42.roles.source=userinfo
quarkus.oidc.42.application-type=web-app

# =============================================================
# SMALLRYE JWT — Bearer token verification (authorization)
# =============================================================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${app.public.url}
mp.jwt.verify.audiences=${app.public.url}
smallrye.jwt.token.header=Authorization
smallrye.jwt.token.schemes=Bearer
smallrye.jwt.enabled=true

# =============================================================
# SMALLRYE JWT — Token signing (creating new JWTs)
# =============================================================
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=${app.public.url}
smallrye.jwt.new-token.audience=${app.public.url}
smallrye.jwt.new-token.lifespan=${ACCESS_EXPIRY:600}

# =============================================================
# SECURITY SETTINGS
# =============================================================
secure.cookies=${SECURE_COOKIES:false}
max.sessions.per.user=${MAX_SESSIONS_PER_USER:5}

# =============================================================
# SEED DATA CONFIGURATION
# =============================================================
# Modes: off (skip), file (from seed_data.json), campus (fetch from API by campus), api (fetch from API by logins)
seed.mode=${SEED_MODE:off}
seed.file=src/main/resources/seed_data.json
seed.campus=${SEED_CAMPUS:Kuala Lumpur}
seed.logins=${SEED_LOGINS:jothomas}

# =============================================================
# INTRA API CALLING CONFIGURATION
# =============================================================
ft.api.retry.max-attempts=4
ft.api.retry.base-delay-seconds=30
ft.api.retry.max-delay-seconds=120

# =============================================================
# LOGGING
# =============================================================
quarkus.log.category."io.quarkus.oidc".level=INFO
quarkus.log.category."io.quarkus.security".level=INFO
quarkus.log.category."org.acme".level=DEBUG
