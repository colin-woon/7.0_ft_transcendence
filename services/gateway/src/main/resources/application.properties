# =============================================================================
# SERVER — Ports
# =============================================================================
quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=disabled
%dev.quarkus.http.port=8080
%dev.quarkus.http.insecure-requests=enabled

# Management endpoint (healthcheck, metrics (prometheus))
quarkus.management.enabled=true
quarkus.management.port=8180
quarkus.management.host=0.0.0.0
quarkus.management.ssl.certificate.key-store-file=/certs/gateway-keystore.p12
quarkus.management.ssl.certificate.key-store-password=${KEYSTORE_PASSWORD}
quarkus.management.ssl.certificate.key-store-file-type=PKCS12
quarkus.management.ssl.certificate.trust-store-file=/certs/shared-truststore.p12
quarkus.management.ssl.certificate.trust-store-password=${TRUSTSTORE_PASSWORD}
quarkus.management.ssl.certificate.trust-store-file-type=PKCS12
quarkus.management.ssl.client-auth=required
%dev.quarkus.management.ssl.client-auth=none
%dev.quarkus.management.ssl.certificate.key-store-file=
%dev.quarkus.management.ssl.certificate.trust-store-file=


# =============================================================================
# INBOUND mTLS — Server identity + who to trust (incoming requests)
# =============================================================================
# Server certificate (proves gateway identity to callers)
quarkus.http.ssl.certificate.key-store-file=/certs/gateway-keystore.p12
quarkus.http.ssl.certificate.key-store-password=${KEYSTORE_PASSWORD}
quarkus.http.ssl.certificate.key-store-file-type=PKCS12

# Trusted CA (clients must present a cert signed by this CA)
quarkus.http.ssl.certificate.trust-store-file=/certs/shared-truststore.p12
quarkus.http.ssl.certificate.trust-store-password=${TRUSTSTORE_PASSWORD}
quarkus.http.ssl.certificate.trust-store-file-type=PKCS12

# Enforce mutual TLS on all incoming connections
quarkus.http.ssl.client-auth=required
%dev.quarkus.http.ssl.client-auth=none
%dev.quarkus.http.ssl.certificate.key-store-file=
%dev.quarkus.http.ssl.certificate.trust-store-file=


# =============================================================================
# Auth Service
# =============================================================================
services.auth.url=${AUTH_SERVICE_URL}
quarkus.rest-client.auth-service.url=${services.auth.url}
%dev.services.auth.url=${DEV_AUTH_SERVICE_URL}
%dev.quarkus.rest-client.auth-service.url=${DEV_AUTH_SERVICE_URL}

# Authentication
gateway.auth.required=true
%dev.gateway.auth.required=false
gateway.auth.public-paths=/api/public/

# Outgoing mTLS — gateway presents its cert to auth-service
# quarkus.rest-client.auth-service.key-store=/certs/gateway-keystore.p12
# quarkus.rest-client.auth-service.key-store-password=${KEYSTORE_PASSWORD}
# quarkus.rest-client.auth-service.key-store-type=PKCS12

# Verify auth-service cert against shared CA
quarkus.rest-client.auth-service.trust-store=/certs/shared-truststore.p12
quarkus.rest-client.auth-service.trust-store-password=${TRUSTSTORE_PASSWORD}
quarkus.rest-client.auth-service.trust-store-type=PKCS12
%dev.quarkus.rest-client.auth-service.key-store=
%dev.quarkus.rest-client.auth-service.trust-store=

# Timeouts
quarkus.rest-client.auth-service.connect-timeout=3000
quarkus.rest-client.auth-service.read-timeout=5000

# JWT Verification
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=accessToken
# quarkus.http.auth.inclusive=true
# quarkus.smallrye-jwt.priority=1000
# quarkus.http.auth.mtls.priority=3000
# quarkus.http.auth.proactive=false
# quarkus.http.auth.permission.public.paths=/api/public/*
# quarkus.http.auth.permission.public.policy=permit
# quarkus.http.auth.permission.public.enabled=true

# Production: issuer must match auth-service app.public.url (https, no port)
mp.jwt.verify.issuer=https://${DOMAIN_NAME:localhost}

# Dev: auth-service is on AUTH_PORT directly
%dev.mp.jwt.verify.issuer=http://${DOMAIN_NAME:localhost}:${AUTH_PORT:8002}

# =============================================================================
# Forum Service
# =============================================================================
services.forum.url=${FORUM_SERVICE_URL}
quarkus.rest-client.forum-service.url=${services.forum.url}
%dev.services.forum.url=${DEV_FORUM_SERVICE_URL}
%dev.quarkus.rest-client.forum-service.url=${DEV_FORUM_SERVICE_URL}

# Outgoing mTLS — gateway presents its cert to forum-service
quarkus.rest-client.forum-service.key-store=/certs/gateway-keystore.p12
quarkus.rest-client.forum-service.key-store-password=${KEYSTORE_PASSWORD}
quarkus.rest-client.forum-service.key-store-type=PKCS12

# Verify forum-service cert against shared CA
quarkus.rest-client.forum-service.trust-store=/certs/shared-truststore.p12
quarkus.rest-client.forum-service.trust-store-password=${TRUSTSTORE_PASSWORD}
quarkus.rest-client.forum-service.trust-store-type=PKCS12
%dev.quarkus.rest-client.forum-service.key-store=
%dev.quarkus.rest-client.forum-service.trust-store=

# Timeouts
quarkus.rest-client.forum-service.connect-timeout=3000
quarkus.rest-client.forum-service.read-timeout=8000

# =============================================================================
# Chat Service
# =============================================================================
services.chat.url=${CHAT_SERVICE_URL}
quarkus.rest-client.chat-service.url=${services.chat.url}
quarkus.rest-client.chat-stream-service.url=${services.chat.url}
%dev.services.chat.url=${DEV_CHAT_SERVICE_URL}
%dev.quarkus.rest-client.chat-service.url=${DEV_CHAT_SERVICE_URL}
%dev.quarkus.rest-client.chat-stream-service.url=${DEV_CHAT_SERVICE_URL}

# Outgoing mTLS — gateway presents its cert to chat-service
quarkus.rest-client.chat-service.key-store=/certs/gateway-keystore.p12
quarkus.rest-client.chat-service.key-store-password=${KEYSTORE_PASSWORD}
quarkus.rest-client.chat-service.key-store-type=PKCS12

# Verify chat-service cert against shared CA
quarkus.rest-client.chat-service.trust-store=/certs/shared-truststore.p12
quarkus.rest-client.chat-service.trust-store-password=${TRUSTSTORE_PASSWORD}
quarkus.rest-client.chat-service.trust-store-type=PKCS12
%dev.quarkus.rest-client.chat-service.key-store=
%dev.quarkus.rest-client.chat-service.trust-store=

# chat-stream-service for longer timeout settings (e.g. WebSocket or SSE connections)
quarkus.rest-client.chat-stream-service.key-store=/certs/gateway-keystore.p12
quarkus.rest-client.chat-stream-service.key-store-password=${KEYSTORE_PASSWORD}
quarkus.rest-client.chat-stream-service.key-store-type=PKCS12
quarkus.rest-client.chat-stream-service.trust-store=/certs/shared-truststore.p12
quarkus.rest-client.chat-stream-service.trust-store-password=${TRUSTSTORE_PASSWORD}
quarkus.rest-client.chat-stream-service.trust-store-type=PKCS12
%dev.quarkus.rest-client.chat-stream-service.key-store=
%dev.quarkus.rest-client.chat-stream-service.trust-store=

# Timeouts
quarkus.rest-client.chat-service.connect-timeout=3000
quarkus.rest-client.chat-service.read-timeout=7000
quarkus.rest-client.chat-stream-service.connect-timeout=5000
quarkus.rest-client.chat-stream-service.read-timeout=3600000

# =============================================================================
# Redis (Rate Limiting)
# =============================================================================
quarkus.redis.hosts=${GW_REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=1s

# Ratelimiting configuration
gateway.config.ratelimit.enabled=true
gateway.config.ratelimit.limit=60
gateway.config.ratelimit.window=60s
# %dev.gateway.config.ratelimit.enabled=false

# =============================================================================
# HEADER & METHOD CONTROL
# =============================================================================
gateway.config.methods.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS

# Inbound allowlist (client -> gateway)
gateway.config.headers.request-allow-list=accept,accept-language,content-type,authorization,user-agent,x-request-id
gateway.config.headers.request-deny-prefixes=x-intra-,x-forwarded-

# Outbound strip list (gateway -> backend services)
gateway.config.headers.response-strip-headers=server,via,x-powered-by
gateway.config.headers.response-strip-prefixes=x-intra-,x-forwarded-


# =============================================================================
# METRICS
# =============================================================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
%dev.quarkus.http.cors.headers=accept,accept-language,content-type,authorization,user-agent,x-request-id
%dev.quarkus.http.cors.access-control-allow-credentials=true
%dev.quarkus.smallrye-openapi.servers=http://localhost:8001


# =============================================================================
# LOGGING & FAULT TOLERANCE
# =============================================================================

# Lower-level HTTP access log. Useful when requests are rejected before the
# JAX-RS request filters/observer hooks run.
# quarkus.http.access-log.enabled=true
# quarkus.http.access-log.pattern=%r %s %D

# -- Console: force ANSI color + compact format for readable docker logs
# %K{level} = ANSI color keyed by level (green/yellow/red); %K{} = reset
# %-5p       = level padded to 5 chars (INFO , WARN , ERROR)
# %-30c{1}   = rightmost class name segment, padded to 30 chars
# %s%e%n     = message + exception chain + newline
quarkus.log.console.format=%d{HH:mm:ss.SSS} %K{level}%-5p%K{} %-30c{1} %s%e%n

# -- Log levels
quarkus.log.category."io.smallrye.faulttolerance".level=DEBUG
# Micrometer re-registers redis.queue.size gauge on first Redis pool use; suppress the duplicate warning
# quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR
