# =============================================================================
# SERVER — Ports
# =============================================================================
quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=disabled

# Management endpoint (healthcheck, metrics) — plain HTTP, no mTLS
quarkus.management.enabled=true
quarkus.management.port=8180
quarkus.management.host=0.0.0.0


# =============================================================================
# INBOUND mTLS — Server identity + who to trust (incoming requests)
# =============================================================================
# Server certificate (proves gateway identity to callers)
quarkus.http.ssl.certificate.key-store-file=/certs/gateway-keystore.p12
quarkus.http.ssl.certificate.key-store-password=bumintra
quarkus.http.ssl.certificate.key-store-file-type=PKCS12

# Trusted CA (clients must present a cert signed by this CA)
quarkus.http.ssl.certificate.trust-store-file=/certs/shared-truststore.p12
quarkus.http.ssl.certificate.trust-store-password=bumintra
quarkus.http.ssl.certificate.trust-store-file-type=PKCS12

# Enforce mutual TLS on all incoming connections
quarkus.http.ssl.client-auth=required


# =============================================================================
# Auth Service
# =============================================================================
services.auth.url=${AUTH_SERVICE_URL}
quarkus.rest-client.auth-service.url=${services.auth.url}

# Authentication
gateway.auth.required=true
# gateway.auth.public-paths=/api/auth/login,/api/auth/callback,/api/auth/refresh,/api/auth/ping
gateway.auth.public-paths=/api/public/

# Outgoing mTLS — gateway presents its cert to auth-service
# quarkus.rest-client.auth-service.key-store=/certs/gateway-keystore.p12
# quarkus.rest-client.auth-service.key-store-password=bumintra
# quarkus.rest-client.auth-service.key-store-type=PKCS12

# Verify auth-service cert against shared CA
quarkus.rest-client.auth-service.trust-store=/certs/shared-truststore.p12
quarkus.rest-client.auth-service.trust-store-password=bumintra
quarkus.rest-client.auth-service.trust-store-type=PKCS12

# Timeouts
quarkus.rest-client.auth-service.connect-timeout=1000
quarkus.rest-client.auth-service.read-timeout=1000

# JWT Verification
mp.jwt.verify.publickey.location=publicKey.pem
# Production: issuer must match auth-service app.public.url (https, no port)
mp.jwt.verify.issuer=https://${DOMAIN_NAME:localhost}
# Dev: auth-service is on AUTH_PORT directly
%dev.mp.jwt.verify.issuer=http://${DOMAIN_NAME:localhost}:${AUTH_PORT:8002}
# smallrye.jwt.token.header=Authorization
# smallrye.jwt.token.cookie=sessionId
mp.jwt.token.header=Authorization
mp.jwt.token.cookie=sessionId

# If you want to enable RBAC
# quarkus.http.auth.permission.authenticated.paths=/api/*
# quarkus.http.auth.permission.authenticated.policy=authenticated
#
# quarkus.http.auth.permission.admin-only.paths=/admin/*
# quarkus.http.auth.permission.admin-only.policy=role-policy
# quarkus.http.auth.permission.admin-only.roles-allowed=ADMIN


# =============================================================================
# Redis (Rate Limiting)
# =============================================================================
quarkus.redis.hosts=${GW_REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=1s

# Ratelimiting configuration
gateway.config.ratelimit.enabled=true
gateway.config.ratelimit.limit=60
gateway.config.ratelimit.window=60s
gateway.config.ratelimit.key-scheme=ip-auth

# =============================================================================
# HEADER & METHOD CONTROL
# =============================================================================
gateway.config.methods.allowed-methods=GET,POST,PUT,DELETE,PATCH

# Inbound allowlist (client -> gateway)
gateway.config.headers.request-allow-list=accept,accept-language,content-type,authorization,user-agent,x-request-id
gateway.config.headers.request-deny-prefixes=x-intra-,x-forwarded-

# Outbound strip list (gateway -> backend services)
gateway.config.headers.response-strip-headers=server,via,x-powered-by
gateway.config.headers.response-strip-prefixes=x-intra-,x-forwarded-


# =============================================================================
# METRICS
# =============================================================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics


# =============================================================================
# LOGGING & FAULT TOLERANCE
# =============================================================================

# -- Console: force ANSI color + compact format for readable docker logs
# %K{level} = ANSI color keyed by level (green/yellow/red); %K{} = reset
# %-5p       = level padded to 5 chars (INFO , WARN , ERROR)
# %-30c{1}   = rightmost class name segment, padded to 30 chars
# %s%e%n     = message + exception chain + newline
quarkus.log.console.format=%d{HH:mm:ss.SSS} %K{level}%-5p%K{} %-30c{1} %s%e%n

# -- Log levels
quarkus.log.category."io.smallrye.faulttolerance".level=DEBUG
# Micrometer re-registers redis.queue.size gauge on first Redis pool use; suppress the duplicate warning
# quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR


# =============================================================================
# %dev — Local development overrides  (./mvnw quarkus:dev)
# All mTLS disabled; plain HTTP only; no cert files required on host machine
# =============================================================================

# Ports
%dev.quarkus.http.port=8080
%dev.quarkus.http.insecure-requests=enabled

# Inbound: no mTLS — accept plain HTTP from browser/curl
%dev.quarkus.http.ssl.client-auth=none
%dev.quarkus.http.ssl.certificate.key-store-file=
%dev.quarkus.http.ssl.certificate.trust-store-file=

# Outbound: no mTLS to auth-service — plain HTTP on localhost
%dev.quarkus.rest-client.auth-service.key-store=
%dev.quarkus.rest-client.auth-service.trust-store=
%dev.services.auth.url=${DEV_AUTH_SERVICE_URL}
$dev.quarkus.rest-client.auth-service.url=${DEV_AUTH_SERVICE_URL}

# Relax behaviour for faster iteration
%dev.gateway.auth.required=false
# %dev.gateway.config.ratelimit.enabled=false

# CORS for local development (allow browser to call gateway from different origin)
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
%dev.quarkus.http.cors.methods=GET,HEAD,POST,PUT,DELETE
%dev.quarkus.http.cors.headers=accept,accept-language,content-type,authorization,user-agent,x-request-id
%dev.quarkus.http.cors.access-control-allow-credentials=true

# Swagger UI
%dev.quarkus.smallrye-openapi.servers=http://localhost:8001

