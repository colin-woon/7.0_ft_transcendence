services:
    db-service:
        image: postgres:18.1-alpine
        container_name: postgres-db
        restart: always
        env_file:
            - ./environment/db.env
        volumes:
            - ./infra/postgres/init-scripts:/docker-entrypoint-initdb.d
            - postgres_data:/var/lib/postgresql
        networks:
            - 42_overflow
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 10s
            timeout: 5s
            retries: 5

    auth-service:
        build:
            context: .
            dockerfile: services/auth/src/main/docker/Dockerfile.custom
            target: production
        container_name: auth-service
        profiles: ['auth', 'all']
        depends_on:
            db-service:
                condition: service_healthy
        networks:
            - 42_overflow
        # auth to add health route or use management port
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/q/health']
            interval: 10s
            timeout: 5s
            start_period: 30s
            retries: 3
        env_file:
            - ./environment/shared.env
            - ./environment/auth.env
        volumes:
            - ./certs/runtime/auth/auth-keystore.p12:/certs/auth-keystore.p12:ro
            - ./certs/runtime/truststore/shared-truststore.p12:/certs/shared-truststore.p12:ro

    chat-service:
        build:
            context: .
            dockerfile: services/chat/Dockerfile
        container_name: chat-service
        profiles: ['chat', 'all']
        depends_on:
            db-service:
                condition: service_healthy
        networks:
            - 42_overflow
        env_file:
            - ./environment/shared.env
            - ./environment/chat.env
        environment:
            - CHAT_PORT=8443
            - CHAT_TLS_ENABLED=true
            - CHAT_TLS_CERT_FILE=/certs/chat.crt
            - CHAT_TLS_KEY_FILE=/certs/chat.key
            - CHAT_TLS_CA_FILE=/certs/internal-ca.crt
        volumes:
            - ./certs/runtime/chat/chat-keystore.p12:/certs/chat-keystore.p12:ro
            - ./certs/runtime/truststore/shared-truststore.p12:/certs/shared-truststore.p12:ro
            - ./certs/runtime/chat/chat.crt:/certs/chat.crt:ro
            - ./certs/runtime/chat/chat.key:/certs/chat.key:ro
            - ./certs/ca/ca.crt:/certs/internal-ca.crt:ro
        # ports:
        #     - '8003:8080'

    forum-service:
        build:
            context: ./services/forum
            dockerfile: Dockerfile
            target: production
        container_name: forum-service
        working_dir: /app
        profiles: ['forum', 'all']
        depends_on:
            db-service:
                condition: service_healthy
        networks:
            - 42_overflow
        env_file:
            - ./environment/shared.env
            - ./environment/forum.env
        healthcheck:
            test: ['CMD', 'curl', '-fk', 'https://localhost:8443/health'] # need to open public route
            interval: 10s
            timeout: 5s
            start_period: 20s
            retries: 3
        command:
            - uv
            - run
            - uvicorn
            - src.main:app
            - --host
            - '0.0.0.0'
            - --port
            - '8443'
            - --ssl-keyfile
            - /certs/forum.key
            - --ssl-certfile
            - /certs/forum.crt
            - --ssl-ca-certs
            - /certs/internal-ca.crt
            - --ssl-cert-reqs
            - '2'
        volumes:
            - ./certs/runtime/forum/forum.key:/certs/forum.key:ro
            - ./certs/runtime/forum/forum.crt:/certs/forum.crt:ro
            - ./certs/ca/ca.crt:/certs/internal-ca.crt:ro

    web-service:
        build:
            context: .
            dockerfile: services/web/Dockerfile
        container_name: web_service
        profiles: ['web', 'all']
        networks:
            - 42_overflow
        env_file:
            - ./environment/web.env
        volumes:
            - ./certs/runtime/web/web.crt:/certs/web.crt:ro
            - ./certs/runtime/web/web.key:/certs/web.key:ro
            - ./certs/ca/ca.crt:/certs/internal-ca.crt:ro

    gateway-service:
        build:
            context: .
            dockerfile: services/gateway/src/main/docker/Dockerfile.custom
            target: production
        container_name: gateway-service
        profiles: ['gateway', 'all']
        networks:
            - 42_overflow
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-fk',
                    '--cert-type',
                    'P12',
                    '--cert',
                    '/certs/gateway-keystore.p12:bumintra',
                    'https://localhost:8180/q/health',
                ]
            interval: 10s
            timeout: 5s
            start_period: 40s
            retries: 3
        depends_on:
            # update to auth_service, now just temporary dev test
            auth-service:
                condition: service_healthy
            gw-redis-service:
                condition: service_healthy
            web-service:
                condition: service_started
        env_file:
            - ./environment/shared.env
            - ./environment/gateway.env
        # environment:
        # AUTH_SERVICE_URL: 'http://gw-auth-service:8080'
        # AUTH_SERVICE_URL: 'https://auth-service:8443'
        # GW_REDIS_URL: 'redis://gw-redis-service:6379'
        # JAVA_TOOL_OPTIONS: '-Djavax.net.debug=ssl:handshake:verbose'
        volumes:
            - ./certs/runtime/gateway/gateway-keystore.p12:/certs/gateway-keystore.p12:ro
            - ./certs/runtime/truststore/shared-truststore.p12:/certs/shared-truststore.p12:ro

    nginx-service:
        image: nginx:stable-alpine
        container_name: nginx
        profiles: ['nginx', 'all']
        ports:
            - '80:80'
            - '443:443'
        depends_on:
            gateway-service:
                condition: service_healthy
            web-service:
                condition: service_started
        networks:
            - 42_overflow
        environment:
            - NGINX_ENTRYPOINT_QUIET_LOGS=1
        volumes:
            - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certs/runtime/nginx/nginx.crt:/etc/nginx/certs/nginx-internal.crt:ro
            - ./certs/runtime/nginx/nginx.key:/etc/nginx/certs/nginx-internal.key:ro
            - ./certs/ca/ca.crt:/etc/nginx/certs/ca-internal.crt:ro

    gw-redis-service:
        build:
            context: ./infra/redis/gateway-redis
            dockerfile: Dockerfile
        container_name: gw-redis-service
        profiles: ['gw-redis', 'gateway', 'all']
        networks:
            - 42_overflow
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            start_period: 10s
            retries: 3

    prometheus-service:
        image: prom/prometheus:v3.10.0
        container_name: prometheus-service
        profiles: ['prometheus', 'all']
        networks:
            - 42_overflow
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.config.file=/etc/prometheus/web.yml
            - --web.external-url=https://localhost/prometheus/
            - --web.route-prefix=/prometheus/
        volumes:
            - ./infra/obs/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
            - ./infra/obs/prometheus/web.prod.yml:/etc/prometheus/web.yml:ro
            - prometheus_data:/prometheus
            - ./certs/runtime/prometheus/prometheus.crt:/certs/prometheus.crt:ro
            - ./certs/runtime/prometheus/prometheus.key:/certs/prometheus.key:ro
            - ./certs/ca/ca.crt:/certs/internal-ca.crt:ro

    grafana-service:
        image: grafana/grafana:12.4.1
        container_name: grafana-service
        profiles: ['grafana', 'all']
        networks:
            - 42_overflow
        environment:
            - GF_SERVER_ROOT_URL=https://localhost/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
            - GF_SERVER_PROTOCOL=https
            - GF_SERVER_CERT_FILE=/certs/grafana.crt
            - GF_SERVER_CERT_KEY=/certs/grafana.key
        volumes:
            - grafana_data:/var/lib/grafana
            - ./infra/obs/grafana/provisioning/datasources/prometheus.prod.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
            - ./infra/obs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./infra/obs/grafana/dashboards:/etc/grafana/dashboards:ro
            - ./certs/runtime/grafana/grafana.crt:/certs/grafana.crt:ro
            - ./certs/runtime/grafana/grafana.key:/certs/grafana.key:ro
            - ./certs/ca/ca.crt:/certs/internal-ca.crt:ro

    # usefull for internal ping test , uncomment to use
    # toolbox:
    #     # profiles:
    #     #     - debug
    #     image: nicolaka/netshoot
    #     container_name: netshoot-toolbox
    #     networks:
    #         - app_net
    #     stdin_open: true # Equivalent to -i
    #     tty: true # Equivalent to -t
    #     command: ['/bin/bash'] # Keeps it alive
    #     volumes:
    #         - ./certs/:/certs/:ro

networks:
    42_overflow:
        driver: bridge

volumes:
    postgres_data:
    prometheus_data:
    grafana_data:
