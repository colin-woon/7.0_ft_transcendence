services:
  db:
    image: postgres:18.1-alpine
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - 42_overflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  auth_service:
    build:
      context: .
      dockerfile: services/auth/src/main/docker/Dockerfile.custom
    container_name: auth_service
    profiles: ["auth", "all"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 42_overflow

  chat_service:
    build:
      context: .
      dockerfile: services/chat/src/main/docker/Dockerfile.custom
    container_name: chat_service
    profiles: ["chat", "all"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 42_overflow

  forum_service:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: forum_service
    profiles: ["forum", "all"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 42_overflow
  
  web_service:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: web_service
    profiles: ["web", "all"]
    networks:
      - 42_overflow
    
  # add other services below here, example:
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis_cache

networks:
  42_overflow:
    driver: bridge

volumes:
  postgres_data: