    # gateway services
    gateway_service:
        build:
            context: ./services/gateway
            dockerfile: Dockerfile
        container_name: gateway_service
        ports:
            - '8080:8080'
        networks:
            - app_net
        depends_on:
            # update to auth_service, now just temporary dev test
            - gw_auth_service
            - gw_redis_service
        environment:
            AUTH_SERVICE_URL: 'http://gw-auth-service:8080'
            GW_REDIS_URL: 'redis://gw-redis-service:6379'
            # QUARKUS_REDIS_HOSTS: 'redis://gw_redis_service:6379/'

    gw_auth_service:
        build:
            context: ./services/dummy/gw_auth
            dockerfile: Dockerfile
        container_name: gw_auth_service
        # ports:
        #     - '9000:9000'
        networks:
            app_net:
                aliases:
                    - gw-auth-service

    gw_redis_service:
        build:
            context: ./infra/redis/gateway-redis
            dockerfile: Dockerfile
        container_name: gw_redis_service
        # ports:
        #   - '6379:6379'
        networks:
            app_net:
                aliases:
                    - gw-redis-service

    toolbox:
        image: nicolaka/netshoot
        container_name: netshoot-toolbox
        networks:
            - app_net
        stdin_open: true # Equivalent to -i
        tty: true # Equivalent to -t
        command: ['/bin/bash'] # Keeps it alive

    # add other services below here, example:
    # redis:
    #   image: redis:7-alpine
    #   container_name: redis_cache
    #   ports:
    #     - "6379:6379"

networks:
    app_net:
        driver: bridge

volumes:
    postgres_data:
