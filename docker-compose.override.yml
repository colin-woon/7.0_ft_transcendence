services:
    db-service:
        env_file:
            - ./environment/db.env
        ports:
            - '${DB_PORT}:5432'

    auth-service:
        build:
            target: development
        env_file:
            - ./environment/shared.env
        ports:
            - '${AUTH_PORT}:8080'
        volumes:
            - ./services/auth:/app

    chat-service:
        build:
            target: development
        env_file:
            - ./environment/shared.env
        ports:
            - '${CHAT_PORT}:8080'
        volumes:
            - ./services/chat:/app

    forum-service:
        env_file:
            - ./environment/shared.env
            - ./environment/forum.env
        ports:
            - '${FORUM_PORT}:8000'
        volumes:
            - ./services/forum:/app
        # uv installs dependencies on the fly from pyproject.toml
        command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

    web-service:
        build:
            target: development
        ports:
            - '${WEB_PORT}:3000'
        volumes:
            - ./services/web:/app
        env_file:
            - ./environment/shared.env
            - ./environment/web.env
        # Strip prod cert volumes and mTLS env — dev runs plain HTTP
        environment:
            - MTLS_KEY_PATH=
            - MTLS_CRT_PATH=
            - MTLS_CA_PATH=
            - NODE_EXTRA_CA_CERTS=
