services:
    db-service:
        env_file:
            - ./environment/db.env
        ports:
            - '${DB_PORT}:5432'

    auth-service:
        build:
            target: development
        env_file:
            - ./environment/shared.env
            - ./environment/auth.env
        ports:
            - '${AUTH_PORT}:8080'
        volumes:
            - ./services/auth:/app
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/q/health']
            interval: 10s
            timeout: 5s
            start_period: 90s
            retries: 5

    chat-service:
        build:
            context: .
            dockerfile: services/chat/Dockerfile
            target: development
        env_file:
            - ./environment/shared.env
            - ./environment/chat.env
        ports:
            - '${CHAT_PORT}:8080'
            - '2345:2345' # Delve debugging port
        volumes:
            - ./services/chat:/app
        environment:
            - CHAT_PORT=8080
            - CHAT_TLS_ENABLED=false
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
            interval: 10s
            timeout: 5s
            start_period: 30s
            retries: 5

    forum-service:
        build:
            target: development
        working_dir: /app
        env_file:
            - ./environment/shared.env
            - ./environment/forum.env
        healthcheck:
            test: ['CMD', 'curl', '-fk', 'http://localhost:8080/health'] # need to open public route
            interval: 10s
            timeout: 5s
            start_period: 30s
            retries: 5
        ports:
            - '${FORUM_PORT}:8080'
        volumes:
            - ./services/forum:/app
        command:
            - uv
            - run
            - uvicorn
            - src.main:app
            - --host
            - '0.0.0.0'
            - --port
            - '8080'
            - --reload

    web-service:
        build:
            target: development
            args:
                NEXT_PUBLIC_API_URL: https://localhost
        ports:
            - '${WEB_PORT}:3000'
            - '9229:9229'
        volumes:
            - ./services/web:/app
        env_file:
            - ./environment/shared.env
            - ./environment/web.env
        # Strip prod cert volumes and mTLS env — dev runs plain HTTP
        environment:
            - MTLS_KEY_PATH=
            - MTLS_CRT_PATH=
            - MTLS_CA_PATH=
            - NODE_EXTRA_CA_CERTS=
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
            interval: 10s
            timeout: 5s
            start_period: 60s
            retries: 5

    gateway-service:
        build:
            context: .
            dockerfile: services/gateway/src/main/docker/Dockerfile.custom
            target: development
        ports:
            - '${GATEWAY_PORT:-8001}:8080'
            - '${GATEWAY_MGMT_PORT:-8180}:8180'
        environment:
            - HOME=/tmp
            - MAVEN_CONFIG=/tmp/.m2
            - MAVEN_OPTS=-Dmaven.repo.local=/tmp/.m2/repository
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8180/q/health']
            interval: 10s
            timeout: 5s
            start_period: 90s
            retries: 5
        volumes:
            - ./services/gateway:/app
        depends_on:
            gw-redis-service:
                condition: service_healthy

    gw-redis-service:
        ports:
            - '6379:6379'

    nginx-service:
        depends_on: {}
        healthcheck:
            test: ['CMD', 'curl', '-fk', 'https://localhost/health']
            interval: 10s
            timeout: 5s
            start_period: 10s
            retries: 3
        volumes:
            - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

    prometheus-service:
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9090/-/healthy']
            interval: 10s
            timeout: 5s
            start_period: 20s
            retries: 3
        volumes:
            - ./infra/obs/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
            - ./infra/obs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
            - ./infra/obs/prometheus/web.dev.yml:/etc/prometheus/web.yml:ro
        ports:
            - '9090:9090'

    postgres-exporter-service:
        volumes:
            - ./infra/obs/postgres-exporter/web.dev.yml:/etc/postgres-exporter/web.yml:ro

    grafana-service:
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
            interval: 10s
            timeout: 5s
            start_period: 20s
            retries: 3
        ports:
            - '9091:3000'
        environment:
            - GF_SERVER_PROTOCOL=http
            - GF_SERVER_CERT_FILE=
            - GF_SERVER_CERT_KEY=
        volumes:
            - ./infra/obs/grafana/provisioning/datasources/prometheus.dev.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
