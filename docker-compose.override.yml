services:
    db-service:
        env_file:
            - ./environment/db.env
        ports:
            - '${DB_PORT}:5432'

    auth-service:
        build:
            target: development
        env_file:
            - ./environment/shared.env
            - ./environment/auth.env
        ports:
            - '${AUTH_PORT}:8080'
        volumes:
            - ./services/auth:/app

    chat-service:
        build:
            context: .
            dockerfile: services/chat/Dockerfile
            target: development
        env_file:
            - ./environment/shared.env
            - ./environment/chat.env
        ports:
            - '${CHAT_PORT}:8080'
        volumes:
            - ./services/chat:/app

    forum-service:
        build:
            target: development
        working_dir: /app
        env_file:
            - ./environment/shared.env
            - ./environment/forum.env
        ports:
            - '${FORUM_PORT}:8080'
        volumes:
            - ./services/forum:/app
        command:
            - uv
            - run
            - uvicorn
            - src.main:app
            - --host
            - '0.0.0.0'
            - --port
            - '8080'
            - --reload

    web-service:
        build:
            target: development
        ports:
            - '${WEB_PORT}:3000'
        volumes:
            - ./services/web:/app
        env_file:
            - ./environment/shared.env
            - ./environment/web.env
        # Strip prod cert volumes and mTLS env — dev runs plain HTTP
        environment:
            - MTLS_KEY_PATH=
            - MTLS_CRT_PATH=
            - MTLS_CA_PATH=
            - NODE_EXTRA_CA_CERTS=

    gateway-service:
        build:
            context: .
            dockerfile: services/gateway/src/main/docker/Dockerfile.custom
            target: development
        ports:
            - '${GATEWAY_PORT:-8001}:8080'
            - '${GATEWAY_MGMT_PORT:-8180}:8180'
        volumes:
            - ./services/gateway:/app
        depends_on:
            auth-service:
                condition: service_healthy
                required: false
            web-service:
                condition: service_started
                required: false
            gw-redis-service:
                condition: service_healthy

    gw-redis-service:
        ports:
            - '6379:6379'

    nginx-service:
        volumes:
            - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
