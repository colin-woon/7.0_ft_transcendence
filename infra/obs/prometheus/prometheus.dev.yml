global:
    scrape_interval: 15s
    evaluation_interval: 15s

rule_files:
    - /etc/prometheus/alerts.yml

scrape_configs:
    - job_name: 'gateway'
      metrics_path: '/metrics'
      static_configs:
          - targets: ['gateway-service:8180']
            labels:
                env: 'development'

    - job_name: 'auth'
      metrics_path: '/metrics'
      static_configs:
          - targets: ['auth-service:9000']
            labels:
                env: 'development'

    - job_name: 'forum'
      metrics_path: '/metrics'
      static_configs:
          - targets: ['forum-service:8080']
            labels:
                env: 'development'

    - job_name: 'chat'
      metrics_path: '/metrics'
      static_configs:
          - targets: ['chat-service:8080']
            labels:
                env: 'development'

    - job_name: 'postgres'
      metrics_path: '/metrics'
      static_configs:
          - targets: ['postgres-exporter-service:9187']
            labels:
                env: 'development'
