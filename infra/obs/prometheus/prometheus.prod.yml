global:
    scrape_interval: 15s
    evaluation_interval: 15s

rule_files:
    - /etc/prometheus/alerts.yml

scrape_configs:
    - job_name: 'gateway'
      metrics_path: '/metrics'
      scheme: https
      tls_config:
          ca_file: /certs/internal-ca.crt
          cert_file: /certs/prometheus.crt
          key_file: /certs/prometheus.key
      static_configs:
          - targets: ['gateway-service:8180']
            labels:
                env: 'production'

    - job_name: 'auth'
      metrics_path: '/metrics'
      scheme: https
      tls_config:
          ca_file: /certs/internal-ca.crt
          cert_file: /certs/prometheus.crt
          key_file: /certs/prometheus.key
      static_configs:
          - targets: ['auth-service:9000']
            labels:
                env: 'production'

    - job_name: 'forum'
      metrics_path: '/metrics'
      scheme: https
      tls_config:
          ca_file: /certs/internal-ca.crt
          cert_file: /certs/prometheus.crt
          key_file: /certs/prometheus.key
      static_configs:
          - targets: ['forum-service:8443']
            labels:
                env: 'production'

    - job_name: 'chat'
      metrics_path: '/metrics'
      scheme: https
      tls_config:
          ca_file: /certs/internal-ca.crt
          cert_file: /certs/prometheus.crt
          key_file: /certs/prometheus.key
      static_configs:
          - targets: ['chat-service:8443']
            labels:
                env: 'production'

    - job_name: 'web'
      metrics_path: '/metrics'
      scheme: https
      tls_config:
          ca_file: /certs/internal-ca.crt
          cert_file: /certs/prometheus.crt
          key_file: /certs/prometheus.key
          server_name: web-service
      static_configs:
          - targets: ['web-service:3000']
            labels:
                env: 'production'

    - job_name: 'postgres'
      metrics_path: '/metrics'
      scheme: https
      tls_config:
          ca_file: /certs/internal-ca.crt
          cert_file: /certs/prometheus.crt
          key_file: /certs/prometheus.key
          server_name: postgres-exporter-service
      static_configs:
          - targets: ['postgres-exporter-service:9187']
            labels:
                env: 'production'
