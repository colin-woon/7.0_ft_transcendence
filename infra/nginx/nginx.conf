# daemon off;

upstream gateway-service {
    server gateway-service:8443;
    keepalive 64;
}

upstream web-service {
    server web-service:3000;
    keepalive 64;
}

# upstream auth-service {
#     server auth-service:8443;
#     keepalive 16;
# }

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bumintra;

    ssl_certificate /etc/nginx/certs/nginx-internal.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-internal.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # OIDC-only: OAuth redirect + callback bypass gateway so the browser
    # redirect chain stays intact. Everything else at /api/auth/** goes
    # through gateway so Prometheus covers all auth API traffic.
    # No client cert presented — auth-service uses OIDC/JWT not mTLS for auth.
    # nginx still verifies auth-service's server cert via shared CA.
    # location ~* ^/auth/(login|callback)/ {
    #     proxy_pass https://auth-service;
    #
    #     proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;
    #     proxy_ssl_verify on;
    #     proxy_ssl_verify_depth 2;
    #     proxy_ssl_session_reuse on;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Intra-Real-IP $remote_addr;
    #     proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location /api/ {
        proxy_pass https://gateway-service;

        # mTLS Identity for the Gateway to verify
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;
    }

    # WebSocket support for web
    location ^~ /ws/ {
        proxy_pass https://gateway-service;

        # mTLS to gateway
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;

        # WebSocket requirements
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;

        # long lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # http2 and SSE support for web
    location ^~ /stream/ {
        proxy_pass https://gateway-service;

        # mTLS to gateway
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;

        # Forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;

        # Force disable Nginx side-buffering for SSE
        proxy_set_header X-Accel-Buffering no;

        # SSE specific tuning
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Keep-alive must be empty for Nginx pooling

        # Cache & Compression: SSE doesn't play well with these
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nopush off;
        tcp_nodelay on;

        # long lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

    }

    location / {
        proxy_pass https://web-service;

        # mTLS to testfe service
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;
    }

}
