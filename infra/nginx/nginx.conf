    #
    #     proxy_ssl_verify on;
    #     proxy_ssl_verify_depth 2;
    #     proxy_ssl_session_reuse on;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Main frontend - testfe with mTLS
    location / {
        proxy_pass https://testfe-service;

        # mTLS to testfe service
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

