# daemon off;

upstream gateway-service {
    server gateway-service:8080;
    keepalive 64;
}

upstream web-service {
    server web-service:3000;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bumintra localhost;

    return 308 https://localhost$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bumintra;
    http2 on;

    ssl_certificate /etc/nginx/certs/nginx-internal.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-internal.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://gateway-service;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;
    }

    location ^~ /ws/ {
        proxy_pass http://gateway-service;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /stream/ {
        proxy_pass http://gateway-service;

        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;

        proxy_set_header X-Accel-Buffering no;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nopush off;
        tcp_nodelay on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web-service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;
    }
}
