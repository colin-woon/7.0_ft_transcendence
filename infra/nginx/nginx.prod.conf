# daemon off;

resolver 127.0.0.11 ipv6=off valid=10s;

upstream gateway_service_upstream {
    zone gateway_service_upstream 64k;
    server gateway-service:8443 resolve;
    keepalive 64;
}

upstream web_service_upstream {
    zone web_service_upstream 64k;
    server web-service:3000 resolve;
    keepalive 64;
}

upstream prometheus_service_upstream {
    zone prometheus_service_upstream 64k;
    server prometheus-service:9090 resolve;
    keepalive 16;
}

upstream grafana_service_upstream {
    zone grafana_service_upstream 64k;
    server grafana-service:3000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bumintra localhost;

    return 308 https://localhost$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bumintra;
    http2 on;

    ssl_certificate /etc/nginx/certs/nginx-internal.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-internal.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Blocks access as security measure to prevent exposure of internal metrics and dashboards.
    #
    # location = /metrics {
    #     return 404;
    # }
    #
    # location ^~ /prometheus/ {
    #     return 404;
    # }
    #
    # location ^~ /grafana/ {
    #     return 404;
    # }

    # http2 and SSE support for web
    location ^~ /api/stream/ {
        proxy_pass https://gateway_service_upstream;

        # mTLS to gateway
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;
        proxy_ssl_server_name on;
        proxy_ssl_name gateway-service;

        # Forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;

        # Force disable Nginx side-buffering for SSE
        proxy_set_header X-Accel-Buffering no;

        # SSE specific tuning
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Keep-alive must be empty for Nginx pooling

        # Cache & Compression: SSE doesn't play well with these
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nopush off;
        tcp_nodelay on;

        # long lived SSE connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

    }

    location /api/ {
        proxy_pass https://gateway_service_upstream;

        # mTLS Identity for the Gateway to verify
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;
        proxy_ssl_server_name on;
        proxy_ssl_name gateway-service;

        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;
    }

    # Note: comment this out for not testing
    location ^~ /prometheus/ {
        proxy_pass https://prometheus_service_upstream;

        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;
        proxy_ssl_server_name on;
        proxy_ssl_name prometheus-service;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Note: comment this out for not testing
    location ^~ /grafana/ {
        proxy_pass https://grafana_service_upstream;

        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;
        proxy_ssl_server_name on;
        proxy_ssl_name grafana-service;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location / {
        proxy_pass https://web_service_upstream;

        # mTLS to testfe service
        proxy_ssl_certificate /etc/nginx/certs/nginx-internal.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx-internal.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca-internal.crt;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;
        proxy_ssl_server_name on;
        proxy_ssl_name web-service;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Intra-Real-IP $remote_addr;
        proxy_set_header X-Intra-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Intra-Forwarded-Proto $scheme;
        proxy_set_header X-Intra-Forwarded-Host $host;
    }

}
